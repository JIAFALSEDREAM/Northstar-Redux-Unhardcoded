modLoader = "javafml"
loaderVersion = "[0,)"
license = "MIT"
issueTrackerURL = "https://github.com/JIAFALSEDREAM/Northstar-Redux-Unhardcoded/issues"


[[mods]]
modId = "northstar"
displayTest = "MATCH_VERSION"
version = "${file.jarVersion}"

displayName = "Northstar Redux Unhardcoded"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/create-northstar-redux-unhardcoded"
logoFile = "logo.png"
credits = "Original mod by lightning2401."
authors = "Redstonneur1256"
description = '''
Create: Northstar - Redux Unhardcoded is a transitional hardcode-removal fork of Northstar Redux for Minecraft 1.21.1 NeoForge.

This build moves planet behavior, rocket and telescope lookups, environment rules, and related hardcoded text paths toward a shared registry-backed PlanetDefinition model. It preserves legacy planet ids for existing saves while exposing Java and KubeJS extension paths for packs and mods.

The fork is focused on compatibility, extension plumbing, and scoped gameplay/content bug fixes inherited from upstream Redux, not new planet content or datapack/JSON planet loading.
'''

[[mixins]]
config = "northstar.mixins.json"

[[dependencies.northstar]]
modId = "neoforge"
type = "required"
versionRange = "[19,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.northstar]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.northstar]]
